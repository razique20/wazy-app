name: wazy
description: Wazy — AI-powered financial budgeting & cash-flow intelligence for personal and business use, with document expiry tracking and renewal alerts.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.0.0
  file_picker: ^8.0.0
  intl: ^0.19.0
  path_provider: ^2.1.2
  supabase_flutter: ^2.0.0
  uuid: ^4.0.0
  shared_preferences: ^2.2.0
  google_fonts: ^6.0.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  pdf: ^3.11.0
  printing: ^5.13.0
  google_mlkit_text_recognition: ^0.17.1
  speech_to_text: ^7.5.0
  http: ^1.2.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
